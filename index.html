<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="습관 기록">
<title>습관 기록</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">오늘</h1>
  <button id="sync" class="sync" type="button" aria-label="저장 상태"></button>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="today" type="button"><span class="ic">📷</span>오늘</button>
  <button data-tab="week" type="button"><span class="ic">🗓</span>주간</button>
  <button data-tab="body" type="button"><span class="ic">📈</span>몸</button>
  <button data-tab="settings" type="button"><span class="ic">⚙︎</span>설정</button>
</nav>
<div id="sheet" class="sheet" hidden></div>
<input id="file" type="file" accept="image/*" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
